<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- Weather Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.10/css/weather-icons.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.10/css/weather-icons-wind.min.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projeto Previsão do Tempo.">
    <meta name="author" content="Thalita">
    <meta name="keywords"
        content="clima, previsão do tempo, Open Meteo, desenvolvimento web, fullstack, HTML, CSS, JavaScript">

    <title>Clima Agora</title>

    <link rel="icon" href="./assets/images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <div class="container">

        <!-- TELA DE BUSCA -->
        <div id="searchScreen">
            <h1>Clima Agora</h1>

            <div class="search-area">
                <input type="text" id="cityInput" placeholder="Digite o nome da cidade">
                <button id="searchBtn" type="button">Buscar</button>
            </div>

            <div id="loading" style="display:none;">Carregando...</div>
            <div id="error" style="display:none;"></div>
        </div>


        <!-- TELA DE RESULTADO -->
        <div id="resultScreen" style="display:none; position: relative;">

            <!-- Botão voltar -->
            <button id="backBtn" title="Voltar ao início">
                <i class="wi wi-direction-left"></i>
            </button>

            <!-- Temperatura + Ícone -->
            <div class="weather-header">
                <i id="weatherIcon" class="wi" style="font-size: 4rem;"></i>
                <p id="temperature"></p>
            </div>

            <!-- Informações principais -->
            <div class="weather-info">
                <h2 id="cityName"></h2>
                <p id="currentDate"></p>
                <p id="description"></p>

                <!-- Variáveis Meteorológicas Adicionais com Ícones -->
                <div class="extra-info">

                    <p>
                        <i class="wi wi-humidity"></i>
                        <strong>Umidade:</strong>
                        <span id="humidity">--</span>%
                    </p>

                    <p>
                        <i class="wi wi-strong-wind"></i>
                        <strong>Vento:</strong>
                        <span id="wind">--</span> km/h
                    </p>

                    <p>
                        <i class="wi wi-raindrop"></i>
                        <strong>Precipitação:</strong>
                        <span id="rain">--</span> mm
                    </p>

                </div>
            </div>



        </div>

    </div>

    <script src="./assets/js/api.js"></script>
</body>

<!-- ===== FOOTER: AVISOS E ATRIBUIÇÕES ===== -->
<footer class="page-footer">
    <p>
        🔒 Esta aplicação não coleta, armazena ou compartilha dados pessoais.
        As buscas são processadas em tempo real e não são registradas.
    </p>
    <p>
        📊 Dados meteorológicos fornecidos por
        <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>
        sob licença
        <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>
    </p>
</footer>

<!-- ===== JAVASCRIPT - Carregado no final para melhor performance ===== -->
<script src="./assets/js/api.js"></script>

</body>

</html>
